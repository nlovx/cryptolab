<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="description" content="CryptoLab: учим криптографию с нуля до уровня элиты. Задания с флагами, лаборатории, повторение.">
</head>
<body>
<title>CryptoLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a hacking-lab shell (deliberately single dark theme, like a terminal room). Sticky top bar with XP and level, tab nav, one view at a time: dashboard, path map, room with tasks, spaced review, toolbox, method. */
:root{
  --bg:#0a0f1d; --panel:#111a2d; --panel2:#17213a; --line:#243150; --ink:#e7ecf8; --muted:#8f9bba;
  --accent:#27c6a8; --accent-soft:#0f3b38; --xp:#ffb547; --xp-soft:#3d2c10; --good:#3ddc97; --good-soft:#0f3526;
  --bad:#ff6b6b; --bad-soft:#3d1717; --soon:#5b6684;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.logo{font:700 18px var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--bg);font:700 14px var(--f-mono);font-style:normal}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav button{background:none;border:0;color:var(--muted);font:600 14.5px var(--f-body);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.nav button.on{background:var(--panel2);color:var(--ink)}
.me{display:flex;align-items:center;gap:10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.xp{color:var(--xp)} .chip.fire{color:#ff8a5c}
@media (max-width:720px){.nav{order:3;flex-basis:100%}}

main{padding-block:24px 64px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:700 clamp(24px,4.4vw,36px)/1.15 var(--f-display)}
h2{font:600 clamp(19px,3vw,24px)/1.25 var(--f-display)}
h3{font:600 17px/1.3 var(--f-body)}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.btn{font:600 15px var(--f-body);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--accent);color:#04201b}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
.bar.xp i{background:var(--xp)}
.num{font-variant-numeric:tabular-nums}

/* dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.lvl{display:flex;flex-direction:column;gap:10px}
.lvl .name{font:700 22px var(--f-display);color:var(--xp)}
.stat b{display:block;font:700 26px var(--f-display)}
.stat span{color:var(--muted);font-size:14px}
.road{display:flex;flex-direction:column;gap:6px}
.roadrow{display:grid;grid-template-columns:30px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--panel2);border:0;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.roadrow .n{font:700 13px var(--f-mono);color:var(--muted)}
.roadrow small{display:block;color:var(--muted);font-size:13px}
.roadrow .pc{font:600 13px var(--f-mono);text-align:right;color:var(--muted)}
.roadrow.done .pc{color:var(--good)}

/* paths */
.path{display:flex;flex-direction:column;gap:12px}
.pathhead{display:flex;gap:14px;align-items:flex-start}
.pathno{font:700 15px var(--f-mono);min-width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.room{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.room:hover:not(.soon){border-color:var(--accent)}
.room .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.room.soon{cursor:default;opacity:.62}
.room.done{border-color:var(--good)}
.tag{display:inline-block;font:600 11.5px var(--f-mono);padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tag.Лёгкая{color:var(--good)} .tag.Средняя{color:var(--xp)} .tag.Сложная{color:var(--bad)}
.tag.soon{color:var(--soon)}
.room>.tag,.chal>.tag{align-self:flex-start}

/* room */
.roomhead{display:flex;flex-direction:column;gap:10px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font:600 14px var(--f-body);align-self:flex-start}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.task>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px;font-weight:600}
.task>summary::-webkit-details-marker{display:none}
.task>summary .tn{font:700 12px var(--f-mono);color:var(--muted);min-width:76px}
.task>summary .ok{margin-left:auto;color:var(--good);font-size:14px}
.task[open]>summary{border-bottom:1px solid var(--line)}
.tbody{padding:18px;display:flex;flex-direction:column;gap:14px}
.content{display:flex;flex-direction:column;gap:12px;max-width:70ch}
.content p,.content li{color:#cfd6e8}
.content ul,.content ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.content b{color:var(--ink)}
.content code{font:13.5px var(--f-mono);background:var(--panel2);padding:1px 6px;border-radius:5px;color:#ffd38a}
.content pre{font:13.5px/1.5 var(--f-mono);background:#070b16;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;overflow-x:auto;color:#cde3ff}
.content .why{background:var(--accent-soft);border-radius:10px;padding:12px 14px;color:var(--ink)}
.content .tool-link{color:var(--accent);cursor:pointer;font-weight:600;align-self:flex-start}
.content .tool-link::before{content:"⚙ "}
.qs{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.q{display:flex;flex-direction:column;gap:8px}
.q .qt{font-weight:600}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans input{flex:1;min-width:180px;font:15px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ans input.okk{border-color:var(--good);color:var(--good)}
.ans input.err{border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.choice.okk{border-color:var(--good);background:var(--good-soft)}
.choice.err{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:14px;color:var(--muted)}
.hintbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13.5px;padding:0;align-self:flex-start}
.solved{font-size:14px;color:var(--good);font-weight:600}
.feyn textarea{width:100%;min-height:110px;font:15px var(--f-body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.donebanner{background:var(--good-soft);border:1px solid var(--good);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--xp);color:#2a1a00;font-weight:700;padding:10px 18px;border-radius:999px;transition:all .3s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* review */
.flash{min-height:220px;display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;text-align:center;padding:28px}
.flash .fq{font:600 clamp(18px,3vw,22px)/1.35 var(--f-body);max-width:46ch}
.flash .fa{color:var(--accent);font-size:17px;max-width:52ch}

/* tools */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer;font:600 14px var(--f-body)}
.tabs button.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.tool{display:flex;flex-direction:column;gap:12px}
.tool label{font-size:13.5px;color:var(--muted);font-weight:600}
.tool textarea,.tool input,.tool select{width:100%;font:14px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tool textarea{min-height:90px;resize:vertical}
.out{font:14px var(--f-mono);background:#070b16;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-all;min-height:44px;color:#cde3ff}
.freq{display:flex;flex-direction:column;gap:3px;font:13px var(--f-mono)}
.freq div{display:grid;grid-template-columns:22px 1fr 54px;gap:8px;align-items:center}
.freq i{display:block;height:10px;background:var(--accent);border-radius:3px}
.method li{color:#cfd6e8}
.method b{color:var(--ink)}
.sync{font-size:12.5px;color:var(--muted)}

/* labs, code tasks */
.lab{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lab .labhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lab label{font-size:13px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px;min-width:0}
.lab input,.lab select,.lab textarea{width:100%;font:14px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.lab textarea{min-height:84px;resize:vertical}
.lab input[type=range]{padding:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.lab .out{font-size:13px;min-height:0;padding:10px}
.lab .btn.ghost{background:var(--bg);border:1px solid var(--line)}
.lab canvas{width:100%;max-width:380px;aspect-ratio:1;background:#070b16;border:1px solid var(--line);border-radius:10px;touch-action:manipulation;align-self:center}
.lab .hl{color:var(--xp);font-weight:600}
.lab .okc{color:var(--good)} .lab .bad{color:var(--bad)}
.bits{display:grid;grid-template-columns:repeat(32,1fr);gap:1px;max-width:380px}
.bits i{aspect-ratio:1;background:var(--line);border-radius:1px}
.bits i.d{background:var(--xp)}
.hexd{font:12.5px/1.6 var(--f-mono);word-break:break-all;color:#cde3ff}
.hexd b{color:var(--xp);background:var(--xp-soft);border-radius:2px}
.mtree{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:4px}
.mnode{flex:1;min-width:0;font:11px var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cde3ff}
button.mnode{cursor:pointer}
.mnode.path{border-color:var(--xp);color:var(--xp)} .mnode.sib{border-color:var(--accent);color:var(--accent)} .mnode.root{border-color:var(--good);color:var(--good)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.cols3{grid-template-columns:1fr}}
.cols3>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:12.5px/1.6 var(--f-mono);word-break:break-all}
.cols3 h4{margin:0 0 4px;font:600 13px var(--f-body)}
.pbar{display:grid;grid-template-columns:44px 1fr 56px;gap:8px;align-items:center;font:13px var(--f-mono)}
.pbar i{display:block;height:12px;background:var(--accent);border-radius:3px;transition:width .3s}
.shares{display:flex;flex-direction:column;gap:4px;font:13px var(--f-mono)}
.shares label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font:13px var(--f-mono);word-break:break-all}
.shares input{width:auto}
.codetask{display:flex;flex-direction:column;gap:8px}
.codetask .row{justify-content:space-between}
.codetask pre{font:13px/1.5 var(--f-mono);background:#070b16;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;overflow-x:auto;color:#cde3ff;max-height:420px}

/* badges, daily, ctf */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.badge .bi{font-size:22px;line-height:1}
.badge b{display:block;font-size:13.5px}
.badge small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.badge.off{opacity:.42;filter:grayscale(1)}
.badge.on{border-color:var(--xp)}
.daily{border-color:var(--xp)}
.daily .qt{font-weight:600}
.chals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chal{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.chal:hover{border-color:var(--accent)}
.chal.done{border-color:var(--good)}
.chal.soon{cursor:default;opacity:.55}
.chal .pts{font:700 13px var(--f-mono);color:var(--xp)}
.chal.done .pts{color:var(--good)}

/* ===== Liquid glass theme: aurora background, frosted panels, neon cyan→violet→pink ===== */
:root{
  --bg:#06071a; --ink:#f1f3ff; --muted:#a3abd0;
  --accent:#67e8f9; --accent2:#c084fc; --pink:#f472b6;
  --accent-soft:rgba(103,232,249,.13); --xp:#fcd34d; --xp-soft:rgba(252,211,77,.14);
  --good:#4ade80; --good-soft:rgba(74,222,128,.13); --bad:#fb7185; --bad-soft:rgba(251,113,133,.14);
  --line:rgba(255,255,255,.13); --panel:rgba(255,255,255,.06); --panel2:rgba(255,255,255,.07);
  --glass:linear-gradient(140deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 12px 40px rgba(2,4,20,.45);
  --grad:linear-gradient(120deg,#67e8f9,#a78bfa 55%,#f472b6);
  --field:rgba(4,6,22,.55);
}
html{background:var(--bg)}
body{background:transparent;min-height:100%}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,#11113a 0%,#06071a 60%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-18vmax;background:#0ea5e9;animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:48vmax;height:48vmax;right:-14vmax;top:8vmax;background:#8b5cf6;animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:42vmax;height:42vmax;left:20vmax;bottom:-22vmax;background:#ec4899;opacity:.38;animation:drift3 38s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:30vmax;height:30vmax;left:-8vmax;bottom:6vmax;background:#14b8a6;opacity:.3;animation:drift2 44s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(18vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,14vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-14vmax,-12vmax) scale(1.1)}}

/* frosted glass on top-level surfaces */
.top,.panel,.task,.flash,.donebanner{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--line);box-shadow:var(--glass-edge)}
.top{border-width:0 0 1px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06),0 8px 30px rgba(2,4,20,.35)}
.panel,.task{border-radius:20px}
.task[open]>summary{border-bottom-color:var(--line)}
/* nested surfaces: tinted glass without extra blur (keeps phones smooth) */
.room,.roadrow,.lab,.badge,.chal,.tabs button{background:rgba(255,255,255,.055);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.room,.chal,.lab{border-radius:16px}
.roadrow{border-radius:14px}
.room,.chal,.roadrow{transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s}
.room:hover:not(.soon),.chal:hover,.roadrow:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(103,232,249,.45)}
.room.done,.chal.done{border-color:rgba(74,222,128,.55)}
/* type and accents */
h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{color:var(--accent)}
.logo i{background:var(--grad);color:#0a0a22;border-radius:9px;box-shadow:0 0 18px rgba(167,139,250,.55)}
.nav button{border-radius:12px}
.nav button.on{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px rgba(255,255,255,.08)}
.chip{background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.btn{background:var(--grad);color:#0b0b24;border-radius:14px;box-shadow:0 6px 22px rgba(167,139,250,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 10px 28px rgba(167,139,250,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.ghost,.lab .btn.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.tabs button.on{background:var(--grad);color:#0b0b24;border-color:transparent}
.bar{background:rgba(255,255,255,.08);height:9px;border-radius:6px}
.bar i{background:var(--grad);box-shadow:0 0 12px rgba(103,232,249,.5)}
.bar.xp i{background:linear-gradient(90deg,#fcd34d,#fb923c);box-shadow:0 0 12px rgba(252,211,77,.5)}
.pathno{background:var(--grad);color:#0b0b24;border-radius:12px}
.lvl .name{background:linear-gradient(90deg,#fcd34d,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}

<script src="content.js"></script>
<script>
"use strict";
const LAB = window.LAB;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- SHA-256 (sync) ----------
const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const enc = new TextEncoder(), dec = new TextDecoder("utf-8",{fatal:false});
function sha256bytes(m){
  const l=m.length,nb=(l+9+63)>>6,buf=new Uint8Array(nb*64);
  buf.set(m);buf[l]=0x80;const dv=new DataView(buf.buffer),bits=l*8;
  dv.setUint32(buf.length-4,bits>>>0);dv.setUint32(buf.length-8,Math.floor(bits/4294967296));
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),W=new Uint32Array(64);
  for(let b=0;b<nb;b++){
    for(let t=0;t<16;t++)W[t]=dv.getUint32(b*64+t*4);
    for(let t=16;t<64;t++){const x=W[t-15],y=W[t-2];
      W[t]=(W[t-16]+(((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3))+W[t-7]+(((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10)))|0;}
    let a=H[0],c1=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const t1=(h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+K[t]+W[t])|0;
      const t2=((((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&c1)^(a&c)^(c1&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=c1;c1=a;a=(t1+t2)|0;}
    H[0]+=a;H[1]+=c1;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }
  return Array.from(H,x=>x.toString(16).padStart(8,"0")).join("");
}
const sha256 = s => sha256bytes(enc.encode(s));
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g," ");

// ---------- model ----------
const XPQ = {"Лёгкая":10,"Средняя":15,"Сложная":20}, ROOM_BONUS = 50;
const allRooms = () => LAB.paths.flatMap(p => p.rooms.map(id => ({id, ...LAB.rooms[id]})));
const liveRooms = () => allRooms().filter(r => !r.soon);
const qsOf = r => r.tasks.flatMap(t => t.qs);
let S = {v:1, solved:{}, srs:{}, notes:{}, days:[], badges:{}};
function roomStats(r){ if(r.soon) return {done:0,total:0,pct:0}; const qs=qsOf(r); const done=qs.filter(q=>S.solved[q.id]).length; return {done,total:qs.length,pct:qs.length?Math.round(done/qs.length*100):0}; }
function xpTotal(){ let xp=0; for(const r of liveRooms()){ const st=roomStats(r); xp+=st.done*(XPQ[r.diff]||10); if(st.total&&st.done===st.total) xp+=ROOM_BONUS; } return xp; }
function level(xp){ let i=0; LAB.levels.forEach((l,k)=>{ if(xp>=l.xp) i=k; }); const cur=LAB.levels[i], nxt=LAB.levels[i+1]; return {i,cur,nxt,pct:nxt?Math.round((xp-cur.xp)/(nxt.xp-cur.xp)*100):100}; }
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function markDay(){ const t=today(); if(!S.days.includes(t)){ S.days.push(t); S.days=S.days.slice(-120); } }
function streak(){ const set=new Set(S.days); let n=0; const d=new Date(); if(!set.has(today())) d.setDate(d.getDate()-1);
  for(;;){ const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if(set.has(k)){n++;d.setDate(d.getDate()-1);} else break; } return n; }

// ---------- storage: db per-viewer doc, else localStorage ----------
const store = { mode:"local", ref:null, pending:false, busy:false, timer:null };
function loadLocal(){ try{ const raw=localStorage.getItem("cryptolab-progress"); if(raw) S={...S,...JSON.parse(raw)}; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem("cryptolab-progress", JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); if(store.mode!=="db") return; store.pending=true; clearTimeout(store.timer); store.timer=setTimeout(flush,700); }
async function flush(){
  if(store.busy||!store.pending) return; store.busy=true; store.pending=false;
  try{ await store.ref.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if(e&&e.code==="invalid_argument"){ store.mode="local"; renderSync(); } }
  store.busy=false; if(store.pending) flush();
}
function merge(a,b){ // union of two progress states (local + cloud)
  const out={v:1,nick:b.nick||a.nick||"",solved:{...a.solved,...b.solved},srs:{...a.srs},notes:{...a.notes,...b.notes},days:[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-120),badges:{...(a.badges||{}),...(b.badges||{})}};
  for(const [k,v] of Object.entries(b.srs||{})){ const o=out.srs[k]; if(!o||(v.t||0)>(o.t||0)) out.srs[k]=v; }
  return out;
}
async function initCloud(tries=0){
  if(!window.claude||!window.claude.use){ if(tries<8) setTimeout(()=>initCloud(tries+1),500); return; }
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return; const uid=await user.id(); if(!uid) return;
    store.ref=db.doc("data/users/"+uid+"/progress");
    const snap=await store.ref.get();
    const cloud=snap.exists?snap.data():null;
    const before=JSON.stringify(S);
    if(cloud) S=merge(S, JSON.parse(JSON.stringify(cloud)));
    store.mode="db"; saveLocal();
    if(!cloud||JSON.stringify(S)!==JSON.stringify(cloud)){ store.pending=true; flush(); }
    if(JSON.stringify(S)!==before) render();
    renderSync();
  }catch(e){ /* stay local */ }
}
function renderSync(){ const el=document.getElementById("sync"); if(el) el.textContent = store.mode==="db" ? "☁ Прогресс сохраняется в твоём аккаунте и виден на всех устройствах." : "Прогресс сохраняется в этом браузере. Чтобы перенести его на другое устройство: «Профиль» → код переноса."; }

// ---------- profile: progress transfer code (no server) ----------
const b64u = bytes => { let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = str => { str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; return Uint8Array.from(atob(str),c=>c.charCodeAt(0)); };
async function pipeBytes(bytes, stream){ const buf=await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer(); return new Uint8Array(buf); }
async function exportCode(){
  const payload={v:1,nick:S.nick||"",solved:Object.keys(S.solved),srs:S.srs,days:S.days,badges:S.badges||{},notes:S.notes};
  const raw=enc.encode(JSON.stringify(payload));
  if(typeof CompressionStream==="function"){ try{ return "CL1."+b64u(await pipeBytes(raw,new CompressionStream("deflate-raw"))); }catch(e){} }
  return "CL0."+b64u(raw);
}
async function importCode(code){
  code=code.trim().replace(/\s+/g,"");
  let raw;
  if(code.startsWith("CL1.")){ if(typeof DecompressionStream!=="function") throw new Error("old"); raw=await pipeBytes(unb64u(code.slice(4)),new DecompressionStream("deflate-raw")); }
  else if(code.startsWith("CL0.")) raw=unb64u(code.slice(4));
  else throw new Error("format");
  const p=JSON.parse(dec.decode(raw));
  if(!p||p.v!==1||!Array.isArray(p.solved)) throw new Error("format");
  const solved={}; p.solved.forEach(id=>{ if(typeof id==="string") solved[id]=1; });
  return {v:1,nick:typeof p.nick==="string"?p.nick.slice(0,24):"",solved,srs:p.srs||{},notes:p.notes||{},days:Array.isArray(p.days)?p.days:[],badges:p.badges||{}};
}
function viewProfile(){
  const xp=xpTotal(), L=level(xp), live=liveRooms();
  const doneRooms=live.filter(r=>{const s=roomStats(r);return s.total&&s.done===s.total;}).length;
  return `<div class="stack"><div><span class="eyebrow">Профиль</span><h1 style="margin-top:6px">${esc(S.nick||"Без ника")}</h1>
  <p class="muted" style="margin-top:6px">${esc(L.cur.name)} · ${xp} XP · ${Object.keys(S.solved).length} флагов · ${doneRooms} комнат · 🔥 ${streak()}</p></div>
  <div class="panel tool"><label for="pf-nick">Ник</label><div class="row"><input id="pf-nick" maxlength="24" value="${esc(S.nick||"")}" placeholder="Например, nagets" style="flex:1;min-width:180px"><button class="btn" id="pf-save">Сохранить</button></div></div>
  <div class="grid2">
    <div class="panel tool"><h3>Перенести прогресс на другое устройство</h3>
      <p class="muted" style="font-size:14px">1. Нажми «Получить код» и скопируй его.<br>2. Отправь себе (например, в Telegram).<br>3. На другом устройстве открой сайт → «Профиль» → вставь код справа.</p>
      <button class="btn" id="pf-make">Получить код</button>
      <textarea id="pf-code" readonly hidden></textarea>
      <button class="btn ghost" id="pf-copy" hidden>Скопировать</button></div>
    <div class="panel tool"><h3>Загрузить прогресс по коду</h3>
      <p class="muted" style="font-size:14px">Прогресс объединится с тем, что уже есть на этом устройстве. Ничего не потеряется.</p>
      <label for="pf-in">Код</label><textarea id="pf-in" placeholder="CL1...."></textarea>
      <button class="btn" id="pf-load">Загрузить</button><span class="muted" id="pf-msg" style="font-size:14px"></span></div>
  </div>
  <p class="muted" style="font-size:14px">Код — это и есть твой «аккаунт»: храни последний код в заметках, и прогресс никогда не потеряется. Чужим его не давай, иначе они получат твой прогресс.</p>
  <p class="sync" id="sync"></p></div>`;
}
function bindProfile(){
  $("#pf-save").onclick=()=>{ S.nick=$("#pf-nick").value.trim().slice(0,24); save(); toast("Ник сохранён"); render(); };
  $("#pf-make").onclick=async()=>{ const t=$("#pf-code"); t.value=await exportCode(); t.hidden=false; $("#pf-copy").hidden=false; t.select(); };
  $("#pf-copy").onclick=async()=>{ const t=$("#pf-code"); try{ await navigator.clipboard.writeText(t.value); toast("Код скопирован"); }catch(e){ t.focus(); t.select(); toast("Выделил код — скопируй вручную"); } };
  $("#pf-load").onclick=async()=>{ const msg=$("#pf-msg");
    try{ const inc=await importCode($("#pf-in").value); const before=Object.keys(S.solved).length; S=merge(S,inc); save(); render();
      toast(`Загружено: +${Object.keys(S.solved).length-before} флагов`); }
    catch(e){ msg.textContent=e.message==="old"?"Этот браузер слишком старый для сжатого кода. Обнови его.":"Код не подходит. Скопируй его целиком, начиная с CL."; } };
}

// ---------- ui helpers ----------
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1800); }
function header(){ $("#xpchip").textContent=xpTotal()+" XP"; $("#streak").textContent="🔥 "+streak(); }
let route={v:"home"};
function go(r){ route=r; try{ history.replaceState(null,"","#"+(r.v==="room"?r.id:r.v)); }catch(e){} render(); window.scrollTo(0,0); }
document.getElementById("nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-v]"); if(b) go({v:b.dataset.v}); });
$("#logo").onclick=()=>go({v:"home"});

function render(){
  checkBadges(true); header();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===route.v || (route.v==="room"&&b.dataset.v==="paths")));
  const v=$("#view");
  if(route.v==="home") v.innerHTML=viewHome();
  else if(route.v==="paths") v.innerHTML=viewPaths();
  else if(route.v==="room") { v.innerHTML=viewRoom(route.id); bindRoom(route.id); mountLabs(route.id); focusQ(); }
  else if(route.v==="review") { v.innerHTML=viewReview(); bindReview(); }
  else if(route.v==="tools") { v.innerHTML=viewTools(); bindTools(route.tool||"convert"); }
  else if(route.v==="method") v.innerHTML=viewMethod();
  else if(route.v==="profile") { v.innerHTML=viewProfile(); bindProfile(); }
  else if(route.v==="ctf"){ if(route.id&&LAB.rooms[route.id]&&!LAB.rooms[route.id].soon){ v.innerHTML=viewChallenge(route.id,route.ti); bindQs(route.id); mountLabs(route.id); } else v.innerHTML=viewCtf(); }
  renderSync();
}
document.getElementById("view").addEventListener("click",e=>{
  const r=e.target.closest("[data-room]"); if(r&&!r.classList.contains("soon")){ go({v:"room",id:r.dataset.room}); return; }
  const p=e.target.closest("[data-path]"); if(p){ go({v:"paths"}); setTimeout(()=>{ const el=document.getElementById(p.dataset.path); if(el) el.scrollIntoView({behavior:"smooth"}); },50); return; }
  const t=e.target.closest("[data-tool]"); if(t){ go({v:"tools",tool:t.dataset.tool}); return; }
  const c=e.target.closest("[data-chal]"); if(c){ const [id,ti]=c.dataset.chal.split(":"); go({v:"ctf",id,ti:+ti}); return; }
  const dq=e.target.closest("[data-daily]"); if(dq){ const [id,qid]=dq.dataset.daily.split("|"); go({v:"room",id,focus:qid}); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ copyCode(cp); return; }
  const g=e.target.closest("[data-go]"); if(g){ go({v:g.dataset.go}); }
});

// ---------- views ----------
function nextRoom(){ return liveRooms().find(r=>{ const s=roomStats(r); return s.done<s.total; }); }
function viewHome(){

function roomCard(id){
  const r={id,...LAB.rooms[id]};
  if(r.soon) return `<div class="room soon"><span class="tag soon">скоро</span><h3>${esc(r.title)}</h3><span class="muted" style="font-size:14px">${esc(r.about)}</span></div>`;
  const s=roomStats(r);
  return `<button class="room${s.done===s.total?" done":""}" data-room="${id}"><div class="meta"><span class="tag ${r.diff}">${r.diff}</span><span>~${r.min} мин</span><span>${r.tasks.length} заданий</span></div><h3>${esc(r.title)}</h3><div class="bar"><i style="width:${s.pct}%"></i></div><span class="muted num" style="font-size:13px">${s.done}/${s.total} ответов</span></button>`;
}
function viewPaths(){
  return `<div class="stack"><div><span class="eyebrow">Карта</span><h1 style="margin-top:6px">Пути обучения</h1></div>`+
  LAB.paths.map((p,i)=>`<section class="panel path" id="${p.id}"><div class="pathhead"><span class="pathno">${String(i).padStart(2,"0")}</span><div><h2>${esc(p.title)}</h2><p class="muted" style="margin-top:4px">${esc(p.about)}</p></div></div><div class="rooms">${p.rooms.map(roomCard).join("")}</div></section>`).join("")+`</div>`;
}
function qHTML(q,hints){
  const ok=!!S.solved[q.id];
  const field=q.choices
    ? `<div class="choices">${q.choices.map((c,ci)=>`<button class="choice" data-q="${q.id}" data-c="${ci}" ${ok?"disabled":""}>${esc(c)}</button>`).join("")}</div>`
    : `<form class="ans" data-q="${q.id}"><input id="in-${q.id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ok?"Решено":"Ответ"}" ${ok?"disabled class=\"okk\"":""}><button class="btn small" ${ok?"disabled":""}>Сдать</button></form>`;
  return `<div class="q" id="q-${q.id}"><span class="qt">${esc(q.q)}</span>${field}${ok?`<span class="solved">✓ Верно</span>`:(hints&&q.hint?`<button class="hintbtn" data-hint="${q.id}">Подсказка</button><span class="hint" id="h-${q.id}" hidden>${esc(q.hint)}</span>`:"")}</div>`;
}
function taskBody(id,t,ti,hints){
  const lab=t.lab&&LABS[t.lab]?`<div class="lab" data-lab="${esc(t.lab)}" data-key="${id}-${ti}"></div>`:"";
  const code=t.code?`<div class="codetask"><div class="row"><span class="eyebrow">Код-задание</span><button class="btn small ghost" data-copy>Копировать</button></div><pre>${esc(t.code)}</pre></div>`:"";
  return `<div class="tbody"><div class="content">${t.body}</div>${lab}${code}<div class="qs">${t.qs.map(q=>qHTML(q,hints)).join("")}</div></div>`;
}
function viewRoom(id){
  const r=LAB.rooms[id]; if(!r||r.soon) return `<p>Комната не найдена.</p>`;
  const p=LAB.paths.find(x=>x.id===r.path), s=roomStats({id,...r});
  let firstOpen=r.tasks.findIndex(t=>t.qs.some(q=>!S.solved[q.id]));
  if(route.focus){ const fi=r.tasks.findIndex(t=>t.qs.some(q=>q.id===route.focus)); if(fi>=0) firstOpen=fi; }
  const tasks=r.tasks.map((t,ti)=>{
    const done=t.qs.every(q=>S.solved[q.id]);
    return `<details class="task" ${ti===(firstOpen<0?-1:firstOpen)?"open":""}><summary><span class="tn">ЗАДАНИЕ ${ti+1}</span><span>${esc(t.t)}</span>${t.ctf?`<span class="tag">CTF</span>`:""}${done?`<span class="ok">✓</span>`:""}</summary>${taskBody(id,t,ti,true)}</details>`;
  }).join("");
  const complete=s.done===s.total;
  return `<div class="stack">
    <div class="roomhead"><button class="back" data-go="paths">← ${esc(p.title)}</button>
      <div class="row"><span class="tag ${r.diff}">${r.diff}</span><span class="muted">~${r.min} мин · ${r.tasks.length} заданий</span></div>
      <h1>${esc(r.title)}</h1><p class="muted" style="max-width:70ch">${esc(r.intro)}</p>
      <div class="bar"><i style="width:${s.pct}%"></i></div></div>
    ${complete?`<div class="donebanner"><b>Комната пройдена! +${ROOM_BONUS} XP бонус</b><span class="muted">Её карточки добавлены в «Повторение». Вернись к ним завтра.</span></div>`:""}
    ${tasks}
    <div class="panel stack feyn"><span class="eyebrow">Метод Фейнмана</span><h3>${esc(r.explain)}</h3><p class="muted" style="font-size:14px">Напиши так, будто объясняешь другу. Если застрял — значит, тут пробел, перечитай задание. Текст сохраняется.</p><textarea id="feyn" placeholder="Объясняю своими словами...">${esc(S.notes[id]||"")}</textarea></div>
  </div>`;
}
function bindQs(id){
  const r=LAB.rooms[id];
  const solve=qid=>{ S.solved[qid]=Date.now(); markDay(); const before=roomStats({id,...r}); save(); const xp=XPQ[r.diff]||10;
    if(before.done===before.total){ toast(`+${xp} XP · комната пройдена! +${ROOM_BONUS}`); } else toast(`+${xp} XP`);
    checkBadges(false); const scroll=window.scrollY; render(); window.scrollTo(0,scroll); };
  document.querySelectorAll("form.ans").forEach(f=>f.addEventListener("submit",e=>{
    e.preventDefault(); const qid=f.dataset.q, q=qsOf(r).find(x=>x.id===qid), inp=f.querySelector("input");
    if(!inp.value.trim()) return;
    if(q.h.includes(sha256(qid+"|"+norm(inp.value)))) solve(qid);
    else { inp.classList.remove("err"); void inp.offsetWidth; inp.classList.add("err"); }
  }));
  document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
    const qid=b.dataset.q, q=qsOf(r).find(x=>x.id===qid);
    if(q.h.includes(sha256(qid+"|"+norm(b.dataset.c)))){ b.classList.add("okk"); setTimeout(()=>solve(qid),350); }
    else b.classList.add("err");
  }));
  document.querySelectorAll("[data-hint]").forEach(b=>b.addEventListener("click",()=>{ document.getElementById("h-"+b.dataset.hint).hidden=false; b.remove(); }));
}
function bindRoom(id){
  bindQs(id);
  const fe=document.getElementById("feyn"); let ft;
  fe.addEventListener("input",()=>{ clearTimeout(ft); ft=setTimeout(()=>{ S.notes[id]=fe.value.slice(0,4000); save(); checkBadges(false); header(); },800); });
}

// ---------- spaced repetition (Leitner) ----------
const BOX_DAYS=[0,1,3,7,16,35];
function cardPool(){ const out=[]; for(const r of liveRooms()){ const s=roomStats(r); if(!s.done) continue; r.cards.forEach((c,i)=>out.push({id:r.id+"-c"+i, q:c[0], a:c[1], room:r.title})); } return out; }
function dueCards(){ const now=Date.now(); return cardPool().filter(c=>{ const st=S.srs[c.id]; return !st||st.due<=now; }); }
let rv={i:0,flip:false,list:[]};
function viewReview(){
  rv.list=dueCards().sort(()=>Math.random()-.5); rv.i=0; rv.flip=false;
  const pool=cardPool().length;
  return `<div class="stack"><div><span class="eyebrow">Интервальное повторение</span><h1 style="margin-top:6px">Повторение</h1>
  <p class="muted" style="margin-top:6px;max-width:70ch">Карточки из пройденных комнат. Знал — карточка вернётся позже (через 1, 3, 7, 16, 35 дней). Не знал — вернётся завтра. Так знания переходят в долгую память. Темы перемешаны специально.</p></div>
  <div class="panel flash" id="flash"></div><p class="muted num" id="rvinfo"></p>
  ${pool?"":`<p class="muted">Пока карточек нет. Начни любую комнату, и её карточки появятся здесь.</p>`}</div>`;
}
function bindReview(){
  const box=document.getElementById("flash"), info=document.getElementById("rvinfo");
  const draw=()=>{
    if(rv.i>=rv.list.length){ box.innerHTML=`<span class="fq">${rv.list.length?"На сегодня всё! 🎉":"Сейчас повторять нечего."}</span><span class="muted">Следующие карточки появятся по расписанию.</span>`; info.textContent=""; return; }
    const c=rv.list[rv.i];
    box.innerHTML=`<span class="tag">${esc(c.room)}</span><span class="fq">${esc(c.q)}</span>${rv.flip?`<span class="fa">${esc(c.a)}</span><div class="row"><button class="btn ghost" id="nope">Не знал</button><button class="btn" id="yep">Знал</button></div>`:`<button class="btn" id="show">Показать ответ</button>`}`;
    info.textContent=`Карточка ${rv.i+1} из ${rv.list.length}`;
    if(!rv.flip) document.getElementById("show").onclick=()=>{rv.flip=true;draw();};
    else { document.getElementById("yep").onclick=()=>grade(true); document.getElementById("nope").onclick=()=>grade(false); }
  };
  const grade=ok=>{ const c=rv.list[rv.i], st=S.srs[c.id]||{b:0}; const b=ok?Math.min(st.b+1,BOX_DAYS.length-1):1;
    S.srs[c.id]={b,due:Date.now()+BOX_DAYS[b]*86400000-3600000,t:Date.now()}; markDay(); save(); checkBadges(false); header(); rv.i++; rv.flip=false; draw(); };
  draw();
}

// ---------- tools ----------
const TOOLS=[["convert","Конвертер"],["xor","XOR"],["mod","Модуль"],["caesar","Цезарь"],["vigenere","Виженер"],["freq","Частоты"],["sha","SHA-256"]];
function viewTools(){ return `<div class="stack"><div><span class="eyebrow">Твой набор взломщика</span><h1 style="margin-top:6px">Инструменты</h1></div><div class="tabs" id="tooltabs">${TOOLS.map(([k,n])=>`<button data-t="${k}">${n}</button>`).join("")}</div><div class="panel tool" id="tool"></div></div>`; }
const hexToBytes=h=>{ h=h.replace(/^0x/i,"").replace(/[^0-9a-f]/gi,""); if(h.length%2) h="0"+h; const out=new Uint8Array(h.length/2); for(let i=0;i<out.length;i++) out[i]=parseInt(h.substr(i*2,2),16); return out; };
const bytesToHex=b=>Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");
const b64enc=b=>{ let s=""; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const b64dec=s=>{ const bin=atob(s.replace(/\s+/g,"")); return Uint8Array.from(bin,c=>c.charCodeAt(0)); };
const printable=b=>Array.from(b,x=>x>=32&&x<127?String.fromCharCode(x):"·").join("");
function scoreEn(b){ const f="etaoin shrdlu"; let s=0; for(const x of b){ const c=String.fromCharCode(x).toLowerCase(); const i=f.indexOf(c); if(i>=0) s+=13-i; else if(x<32&&x!==10||x>126) s-=20; } return s; }
function bindTools(which){
  const tabs=document.getElementById("tooltabs"), box=document.getElementById("tool");
  const show=k=>{ route.tool=k; tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===k)); box.innerHTML=TOOLHTML[k]; TOOLJS[k](); };
  tabs.onclick=e=>{ const b=e.target.closest("button[data-t]"); if(b) show(b.dataset.t); };
  show(which);
}
const TOOLHTML={
  convert:`<label for="cv-in">Вход</label><textarea id="cv-in">hi</textarea><label for="cv-mode">Что сделать</label><select id="cv-mode"><option value="t2h">текст → hex</option><option value="h2t">hex → текст</option><option value="t2b">текст → Base64</option><option value="b2t">Base64 → текст</option><option value="h2b">hex → Base64</option><option value="b2h">Base64 → hex</option><option value="t2bin">текст → двоичный</option><option value="n2all">число → hex / двоичный</option></select><label>Результат</label><div class="out" id="cv-out"></div>`,
  xor:`<label for="x-in">Данные (hex)</label><textarea id="x-in">3c363b3d2122352805332905283f2c3f28293338363f27</textarea><label for="x-key">Ключ (hex, повторяется по кругу)</label><input id="x-key" value="5a"><label>Результат: hex и текст</label><div class="out" id="x-out"></div><button class="btn ghost" id="x-brute">Перебрать все 256 однобайтовых ключей</button><div class="out" id="x-brute-out" hidden></div><p class="muted" style="font-size:14px">Подсказка: чтобы зашифровать текст, сначала переведи его в hex в «Конвертере».</p>`,
  mod:`<div class="grid3"><div><label for="m-a">a</label><input id="m-a" value="7"></div><div><label for="m-b">b (степень)</label><input id="m-b" value="5"></div><div><label for="m-n">n (модуль)</label><input id="m-n" value="13"></div></div><label>Результаты (работает с огромными числами)</label><div class="out" id="m-out"></div>`,
  caesar:`<label for="c-in">Текст</label><textarea id="c-in">WKH TXLFN EURZQ IRA</textarea><label for="c-k">Сдвиг: <span id="c-kv">3</span></label><input id="c-k" type="range" min="0" max="25" value="23"><label>Результат</label><div class="out" id="c-out"></div><button class="btn ghost" id="c-all">Показать все 25 сдвигов</button><div class="out" id="c-allout" hidden></div>`,
  vigenere:`<label for="v-in">Текст (латиница)</label><textarea id="v-in">ATTACKATDAWN</textarea><label for="v-key">Ключ</label><input id="v-key" value="LEMON"><label>Зашифровать</label><div class="out" id="v-enc"></div><label>Расшифровать</label><div class="out" id="v-dec"></div>`,
  freq:`<label for="f-in">Шифротекст</label><textarea id="f-in">aol rlf pz opkklu pu wshpu zpnoa</textarea><label>Частоты букв (англ. эталон: E 12.7%, T 9.1%, A 8.2%, O 7.5%)</label><div class="freq" id="f-out"></div>`,
  sha:`<label for="s-in">Текст</label><textarea id="s-in">hello</textarea><label>SHA-256</label><div class="out" id="s-out"></div><p class="muted" style="font-size:14px">Поменяй одну букву и посмотри, как меняется весь отпечаток.</p>`
};
const TOOLJS={
  convert(){ const i=$("#cv-in"),m=$("#cv-mode"),o=$("#cv-out"); const run=()=>{ const s=i.value; let r;
    try{ switch(m.value){
      case"t2h": r=bytesToHex(enc.encode(s)); break;
      case"h2t": r=dec.decode(hexToBytes(s)); break;
      case"t2b": r=b64enc(enc.encode(s)); break;
      case"b2t": r=dec.decode(b64dec(s)); break;
      case"h2b": r=b64enc(hexToBytes(s)); break;
      case"b2h": r=bytesToHex(b64dec(s)); break;
      case"t2bin": r=Array.from(enc.encode(s),x=>x.toString(2).padStart(8,"0")).join(" "); break;
      case"n2all": { const n=BigInt(s.trim()); r="dec: "+n.toString()+"\nhex: 0x"+n.toString(16)+"\nbin: 0b"+n.toString(2); } }
    }catch(e){ r="Не получилось разобрать вход. Проверь формат."; } o.textContent=r; };
    i.oninput=run; m.onchange=run; run(); },
  xor(){ const i=$("#x-in"),k=$("#x-key"),o=$("#x-out"); const run=()=>{ const d=hexToBytes(i.value),key=hexToBytes(k.value); if(!key.length||!d.length){o.textContent="Нужны данные и ключ в hex.";return;}
      const r=d.map((x,j)=>x^key[j%key.length]); o.textContent="hex:   "+bytesToHex(r)+"\nтекст: "+printable(r); };
    i.oninput=run; k.oninput=run; run();
    $("#x-brute").onclick=()=>{ const d=hexToBytes(i.value); const res=[]; for(let kk=0;kk<256;kk++){ const r=d.map(x=>x^kk); res.push({kk,s:scoreEn(r),t:printable(r)}); }
      res.sort((a,b)=>b.s-a.s); const out=$("#x-brute-out"); out.hidden=false; out.textContent="Лучшие варианты (по похожести на английский):\n"+res.slice(0,8).map(x=>"0x"+x.kk.toString(16).padStart(2,"0")+"  "+x.t).join("\n"); }; },
  mod(){ const a=$("#m-a"),b=$("#m-b"),n=$("#m-n"),o=$("#m-out");
    const pw=(x,e,m)=>{ let r=1n; x%=m; if(x<0n)x+=m; while(e>0n){ if(e&1n) r=r*x%m; x=x*x%m; e>>=1n; } return r; };
    const g=(x,y)=>{ x=x<0n?-x:x; y=y<0n?-y:y; while(y){ [x,y]=[y,x%y]; } return x; };
    const inv=(x,m)=>{ let [r0,r1]=[((x%m)+m)%m,m],[s0,s1]=[1n,0n]; while(r1){ const q=r0/r1; [r0,r1]=[r1,r0-q*r1]; [s0,s1]=[s1,s0-q*s1]; } return r0===1n?((s0%m)+m)%m:null; };
    const run=()=>{ try{ const A=BigInt(a.value.trim()),B=BigInt(b.value.trim()),N=BigInt(n.value.trim()); if(N<=0n) throw 0;
      const iv=inv(A,N); o.textContent=`a mod n        = ${((A%N)+N)%N}\na^b mod n      = ${B>=0n?pw(A,B,N):"степень должна быть ≥ 0"}\ngcd(a, n)      = ${g(A,N)}\na⁻¹ mod n      = ${iv===null?"не существует (gcd ≠ 1)":iv}\n(a + b) mod n  = ${(((A+B)%N)+N)%N}\n(a · b) mod n  = ${(((A*B)%N)+N)%N}`;
    }catch(e){ o.textContent="Введи целые числа, n > 0."; } };
    [a,b,n].forEach(x=>x.oninput=run); run(); },
  caesar(){ const i=$("#c-in"),k=$("#c-k"),kv=$("#c-kv"),o=$("#c-out");
    const sh=(s,d)=>s.replace(/[a-z]/gi,c=>{ const B=c<="Z"?65:97; return String.fromCharCode((c.charCodeAt(0)-B+d+26)%26+B); });
    const run=()=>{ kv.textContent=k.value+" (расшифровка сдвигом "+((26-k.value)%26)+")"; o.textContent=sh(i.value,+k.value); };
    i.oninput=run; k.oninput=run; run();
    $("#c-all").onclick=()=>{ const out=$("#c-allout"); out.hidden=false; out.textContent=Array.from({length:25},(_,j)=>"сдвиг "+String(j+1).padStart(2," ")+" назад: "+sh(i.value,26-(j+1))).join("\n"); }; },
  vigenere(){ const i=$("#v-in"),k=$("#v-key");
    const run=()=>{ const key=k.value.toUpperCase().replace(/[^A-Z]/g,""); const t=i.value.toUpperCase().replace(/[^A-Z]/g,"");
      if(!key){ $("#v-enc").textContent=$("#v-dec").textContent="Нужен ключ из латинских букв."; return; }
      const f=s=>[...t].map((c,j)=>String.fromCharCode((c.charCodeAt(0)-65+s*(key.charCodeAt(j%key.length)-65)+26)%26+65)).join("");
      $("#v-enc").textContent=f(1); $("#v-dec").textContent=f(-1); };
    i.oninput=run; k.oninput=run; run(); },
  freq(){ const i=$("#f-in"),o=$("#f-out"); const run=()=>{ const c={}; let n=0; for(const ch of i.value.toLowerCase()) if(/[a-zа-яё]/.test(ch)){ c[ch]=(c[ch]||0)+1; n++; }
      const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,26); const mx=rows.length?rows[0][1]:1;

const bmod=(a,m)=>((a%m)+m)%m;
const bpow=(x,e,m)=>{ let r=1n; x=bmod(x,m); while(e>0n){ if(e&1n) r=r*x%m; x=x*x%m; e>>=1n; } return r; };

  for(const a of SMALLP){ let x=bpow(a,d,n); if(x===1n||x===n-1n) continue; let c=false; for(let i=1;i<s;i++){ x=x*x%n; if(x===n-1n){ c=true; break; } } if(!c) return false; } return true; }

    const lat=[]; for(let i=-20;i<=20;i++) for(let j=-20;j<=20;j++){ const x=i*b1[0]+j*b2[0], y=i*b1[1]+j*b2[1]; if(Math.abs(x)<=V+1&&Math.abs(y)<=V+1) lat.push([x,y]); }
    let t, near, guess=null, bab=null;
    const closest=(px,py)=>{ let b=null,bd=1e9; for(const l of lat){ const d=(l[0]-px)**2+(l[1]-py)**2; if(d<bd){ bd=d; b=l; } } return b; };
    const fresh=()=>{ const inner=lat.filter(l=>Math.abs(l[0])<V-4&&Math.abs(l[1])<V-4), v=inner[Math.floor(Math.random()*inner.length)], e=+q("[data-e]").value, ang=Math.random()*6.283, r=e*Math.sqrt(Math.random());
      t=[v[0]+r*Math.cos(ang),v[1]+r*Math.sin(ang)]; near=closest(...t); guess=null; bab=null; q("[data-o]").textContent="Где ближайшая точка решётки?"; draw(); };
    const basis=()=>q("[data-bs]").value==="g"?[b1,b2]:bad;
    const draw=()=>{ const {g}=canvasCtx(cv); g.strokeStyle=tok("--line"); g.beginPath(); g.moveTo(0,180); g.lineTo(360,180); g.moveTo(180,0); g.lineTo(180,360); g.stroke();
      g.fillStyle="#7d8cb8"; for(const [x,y] of lat){ g.beginPath(); g.arc(X(x),Y(y),3,0,7); g.fill(); }
      const arrow=(v,col)=>{ g.strokeStyle=col; g.lineWidth=2.5; g.beginPath(); g.moveTo(180,180); g.lineTo(X(v[0]),Y(v[1])); g.stroke(); g.lineWidth=1; };
      const [u,w]=basis(); arrow(u,tok("--accent")); arrow(w,tok("--xp"));
      const ring=(p,col)=>{ if(!p) return; g.strokeStyle=col; g.lineWidth=2.5; g.beginPath(); g.arc(X(p[0]),Y(p[1]),8,0,7); g.stroke(); g.lineWidth=1; };
      ring(guess,tok("--ink")); ring(bab,tok("--xp")); if(guess||bab) ring(near,tok("--good"));
      g.fillStyle=tok("--bad"); g.beginPath(); g.arc(X(t[0]),Y(t[1]),5,0,7); g.fill(); };
    cv.onclick=e=>{ const [x,y]=canvasXY(cv,e); guess=closest((x-180)/sc,(180-y)/sc); const ok=guess===near;
      q("[data-o]").innerHTML=ok?`<span class="okc">✓ Верно!</span> Ближайшая точка (${near}). Зелёное кольцо — правильный ответ.`:`<span class="bad">✗ Мимо.</span> Ты выбрал (${guess}), ближе (${near}) — зелёное кольцо.`; draw(); };
    q("[data-bab]").onclick=()=>{ const [u,w]=basis(), D=u[0]*w[1]-u[1]*w[0], c1=Math.round((t[0]*w[1]-t[1]*w[0])/D), c2=Math.round((u[0]*t[1]-u[1]*t[0])/D);
      bab=[c1*u[0]+c2*w[0],c1*u[1]+c2*w[1]]; const hit=bab[0]===near[0]&&bab[1]===near[1], far=Math.hypot(bab[0]-t[0],bab[1]-t[1]).toFixed(2);
      q("[data-o]").innerHTML=`Бабаи: t = ${c1}·b₁ + ${c2}·b₂ → (${bab}), расстояние ${far}. `+(hit?`<span class="okc">✓ попал в ближайшую</span>`:`<span class="bad">✗ промах</span>`)+`\n${q("[data-bs]").value==="g"?"С хорошим базисом округление почти всегда работает.":"С плохим базисом округление часто промахивается. На этом держится LWE."}`; draw(); };
    q("[data-bs]").onchange=()=>{ bab=null; draw(); }; q("[data-new]").onclick=fresh; q("[data-e]").onchange=fresh;
    if(det===0){ q("[data-o]").textContent="Базис вырожден."; return; } fresh();
  }
};
const md=(a,p)=>((a%p)+p)%p;
function ninv(a,p){ a=md(a,p); let r0=a,r1=p,s0=1,s1=0; while(r1){ const k=Math.floor(r0/r1); [r0,r1]=[r1,r0-k*r1]; [s0,s1]=[s1,s0-k*s1]; } return r0===1?md(s0,p):null; }
function ecAdd(P,Q,c){ if(!P) return Q; if(!Q) return P; const p=c.p;
  if(P[0]===Q[0]&&md(P[1]+Q[1],p)===0) return null;
  const l=P[0]===Q[0]?md((3*P[0]*P[0]+c.a)*ninv(2*P[1],p),p):md((Q[1]-P[1])*ninv(Q[0]-P[0],p),p);
  const x=md(l*l-P[0]-Q[0],p); return [x,md(l*(P[0]-x)-P[1],p)]; }
function ecMul(k,P,c){ let R=null, A=P; while(k>0){ if(k&1) R=ecAdd(R,A,c); A=ecAdd(A,A,c); k=Math.floor(k/2); } return R; }
function ecPoints(c){ const sq=new Map(); for(let y=0;y<c.p;y++){ const s=y*y%c.p; if(!sq.has(s)) sq.set(s,[]); sq.get(s).push(y); }
  const out=[]; for(let x=0;x<c.p;x++){ const r=md((x*x%c.p)*x+c.a*x+c.b,c.p); for(const y of sq.get(r)||[]) out.push([x,y]); } return out; }
